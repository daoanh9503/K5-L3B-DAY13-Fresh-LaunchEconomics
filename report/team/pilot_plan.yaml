# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) — số do src/lab13.py tính
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels NormalIndPower cho 1.250).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng luôn < c / ICC = 1.000 < 1.251: không đạt, dù mỗi người xử lý bao nhiêu.
#   d) 6 depot mỗi nhóm: hiệu dụng tối đa < 6 / 0,02 = 300: loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên đối chứng xin câu trả lời của đồng nghiệp cùng depot; chỉ cấp quyền theo tài khoản, log lượt mở trợ lý theo staff_id, đối chứng có lượt mở thì ghi vi phạm.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07, không sửa trong lúc chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: với 40 nhân viên không cách chia theo cụm nào thấy được +5 điểm. Chọn chia theo nhân viên
#   và chấp nhận chỉ thấy được mức chênh 6 điểm (mde 0,06), mỗi người cần ≥ 299 yêu cầu. Con số bất lợi: nếu tác động
#   thật chỉ +5 điểm thì power với 859 mỗi nhóm chỉ còn 0,64, tức khoảng 1/3 khả năng bỏ sót.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% toàn mẫu (51/1.200), 3,97% trong phạm vi
#   noi_dia + hang_nang. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên so với nhóm đối chứng (cao hơn ≥ 2 điểm)
#   kèm trần tuyệt đối 6%. Hoàn trùng (ca lỗi 20) ngưỡng 0 ca.
#
# Ghi chú: chỉ số chính trong đợt chạy thử (phạm vi noi_dia + hang_nang) là 92,3%, cao hơn baseline đề cho 0,70;
#   đợt chạy thử không có đối chứng nên không dùng con số này để nói trợ lý đã nâng chỉ số.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loai noi_dia và hang_nang (2.696 đ = 0,22× và 8.221 đ = 0,69× so với 12.000 đ, simulated), 40 nhân viên CSKH ở cả 12 depot; loại quoc_te (22.515 đ = 1,88×, thành công 27,3%) và doi_tac (10.215 đ = 0,85×, điều khoản riêng); giới hạn tối đa 2 lần chạy (rẻ nhất cho cả hệ thống ở B3, simulated)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính ở bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 40 nhân viên không đủ cho 0.05
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; cần 20 × 299 = 5.980 yêu cầu mỗi nhóm
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên, ICC 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng loại yêu cầu với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; quyền truy cập theo tài khoản, log lượt mở trợ lý theo staff_id, báo vi phạm khi đối chứng có lượt mở"
    predeclared: "Có: chỉ số chính, mde 0,06, ba luật dừng và ngày quyết định 2027-01-15 chốt trước ngày bắt đầu 2026-12-07; seed bốc thăm ghi trong repo"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng cho cùng một đơn TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành bật cờ tắt trợ lý trong 30 phút và Kỹ sư trưởng agent báo cáo nguyên nhân trong 24 giờ KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công trong phạm vi vượt 6.000 đ (0,5× của 12.000 đ; đợt chạy thử là 3.414 đ, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và rà lại tỉ lệ xem lại, làm lại KHÔNG THÌ không được mở thêm loại yêu cầu hay depot nào"
    - "NẾU nhân viên nhóm trợ lý mở trợ lý cho dưới 60% số yêu cầu đủ điều kiện TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và sửa luồng làm việc KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bật cờ tắt trợ lý, hiệu lực trong 30 phút; yêu cầu đang mở chuyển về hàng đợi nhân viên kèm tóm tắt; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-15"
  simulated_inputs:
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (890 và 1.132 phút)"
    - "Chi phí mỗi việc thành công 4.472 đ toàn mẫu, 3.414 đ trong phạm vi (A2, A4)"
    - "Chi phí theo loại 2.696 · 8.221 · 22.515 · 10.215 đ (A3)"
    - "Chi phí cả hệ thống theo giới hạn chạy 7.449.781 · 6.901.220 · 7.037.585 đ (B3)"
    - "Ngưỡng chi phí 6.000 đ trong luật dừng thứ hai"
